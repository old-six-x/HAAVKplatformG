<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- 适配手机屏幕 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="faviconHavvk.ico" type="image/x-icon">
    <title>哈夫克集团-网站导览</title>
    <style>
        /* 重置页面默认边距，铺满全屏 */
        *{
            margin: 0;
            padding: 0;
        }
        body {
            /* 背景图完整铺满全屏 */
            background-image: url("https://cdn.yiranlaoshi.com/video/1785237961145-壁纸-upscaled.png");
            background-size: cover;       /* 图片完整覆盖屏幕，无留白 */
            background-repeat: no-repeat; /* 不重复平铺 */
            background-position: center;  /* 图片居中显示 */
            background-attachment: fixed; /* 滚动页面背景不动 */
            min-height: 100vh;            /* 页面高度强制等于屏幕高度，解决只显示一半 */
            padding: 30px 20px;           /* 文字留出边距，不贴屏幕边缘 */
        }
        /* h1 白色加粗 */
        h1 {
            color: #ffffff;
            font-weight: bold;
            font-size: 42px;
            margin-bottom: 20px;
        }
        /* 导航链接白色，去掉默认蓝色下划线 */
        a {
            color: #fff;
            font-size: 20px;
            text-decoration: none;
            margin-right: 25px;
        }
        /* 鼠标悬浮链接变浅灰，提升交互 */
        a:hover {
            color: #cccccc;
        }
    </style>
</head>
<body>
    <h1>哈夫克集团网站导览</h1>
    <a href="https://old-six-x.github.io/GFB/">哈夫克集团介绍</a>
    <a href="https://link.haavk.space/">哈夫克智能全球加速</a>
</body>
</html>
