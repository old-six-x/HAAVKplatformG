<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="faviconHavvk.ico" type="image/x-icon">
    <title>哈夫克集团-网站导览</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-image: url("https://cdn.yiranlaoshi.com/video/1785237961145-壁纸-upscaled.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 30px;
            /* 垂直弹性布局，自动把底部内容压到页面底端 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h1 {
            color: #ffffff;
            font-weight: bold;
            font-size: 44px;
            margin-bottom: 35px;
        }
        .btn-wrap{
            display: flex;
            gap: 30px;
            justify-content: center;
        }
        .galaxy-btn{
            position: relative;
            padding: 4px;
            border-radius: 16px;
            background: linear-gradient(45deg, #220044, #440088, #0066cc, #00ccff, #9933ff, #220044);
            background-size: 400% 400%;
            animation: galaxy-flow 3s linear infinite;
            box-shadow: 0 0 20px #7733ff88, 0 0 40px #00aaff66, 0 0 60px #cc44ff44;
        }
        .btn-inner{
            background-color: #0a0a18;
            border-radius: 14px;
            padding: 18px 36px;
        }
        .btn-inner a {
            color: #fff;
            font-size: 20px;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .btn-inner a:hover {
            color: #aaddff;
            text-shadow: 0 0 8px #66ccff;
        }
        @keyframes galaxy-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 底部整组容器：图标+版权文字 */
        .bottom-group{
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }
        /* B站+Github同行居中 */
        .icon-group{
            display: flex;
            gap: 35px;
            align-items: center;
        }
        .icon-group img{
            border: none;
            width: 15px; /* 缩小图标，匹配截图小巧样式 */
            opacity: 0.7; /* 灰色半透明效果 */
        }
        .footer-text{
            color: #aaaaaa;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- 顶部内容区 -->
    <div class="top-content">
        <h1>哈夫克集团网站导览</h1>
        <div class="btn-wrap">
            <div class="galaxy-btn">
                <div class="btn-inner">
                    <a href="https://old-six-x.github.io/GFB/" target="_blank">哈夫克集团介绍</a>
                </div>
            </div>
            <div class="galaxy-btn">
                <div class="btn-inner">
                    <a href="https://link.haavk.space/" target="_blank">哈夫克智能全球加速</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 页面最底端：图标 + 版权文字 -->
    <div class="bottom-group">
        <div class="icon-group">
            <a href="https://space.bilibili.com/1255142697?spm_id_from=333.337.0.0" target="_blank">
                <img src="https://cdn.yiranlaoshi.com/video/1785242314044-bilibili.png" alt="bilibili">
            </a>
            <a href="https://github.com/old-six-x" target="_blank">
                <img src="https://cdn.yiranlaoshi.com/video/1785242509397-github.png" alt="github">
            </a>
        </div>
        <div class="footer-text">
            反馈与投诉：lucas_xinshu@163.com  -   由飞友工作室（Github同昵者）创造
        </div>
    </div>
</body>
</html>
