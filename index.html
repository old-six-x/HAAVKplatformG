<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="faviconHavvk.ico" type="image/x-icon">
    <title>哈夫克集团-网站导览</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* 全屏背景完整铺满不截断 */
            background-image: url("https://cdn.yiranlaoshi.com/video/1785237961145-壁纸-upscaled.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 30px;
        }
        h1 {
            color: #ffffff;
            font-weight: bold;
            font-size: 44px;
            margin-bottom: 35px;
        }
        /* 按钮容器，让两个按钮同行居中 */
        .btn-wrap{
            display: flex;
            gap: 30px; /* 两个按钮之间的间隔 */
        }
        /* 单个银河闪烁按钮外层动画边框 */
        .galaxy-btn{
            position: relative;
            padding: 4px;
            border-radius: 16px;
            background: linear-gradient(45deg, #220044, #440088, #0066cc, #00ccff, #9933ff, #220044);
            background-size: 400% 400%;
            animation: galaxy-flow 3s linear infinite;
            box-shadow: 0 0 20px #7733ff88, 0 0 40px #00aaff66, 0 0 60px #cc44ff44;
        }
        /* 按钮内部深色底色 */
        .btn-inner{
            background-color: #0a0a18;
            border-radius: 14px;
            padding: 18px 36px;
        }
        /* 链接文字样式 */
        .btn-inner a {
            color: #fff;
            font-size: 20px;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .btn-inner a:hover {
            color: #aaddff;
            text-shadow: 0 0 8px #66ccff;
        }
        /* 银河流动动画 */
        @keyframes galaxy-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <h1>哈夫克集团网站导览</h1>
    <!-- 按钮容器，横向摆放两个独立银河按钮 -->
    <div class="btn-wrap">
        <!-- 第一个独立银河按钮 -->
        <div class="galaxy-btn">
            <div class="btn-inner">
                <a href="https://old-six-x.github.io/GFB/">哈夫克集团介绍</a>
            </div>
        </div>
        <!-- 第二个独立银河按钮 -->
        <div class="galaxy-btn">
            <div class="btn-inner">
                <a href="https://link.haavk.space/">哈夫克智能全球加速</a>
            </div>
        </div>
    </div>
</body>
</html>
